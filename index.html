<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script defer src="script.js"></script>
        <title>Sign-up Form</title>
    </head>
    <body>
        <div class="logo-panel">
            <div class="logo">ODIN</div>
        </div>
        <div>
            <div>
                <p>This is not a real online service! You know you need 
                    something like this in your life to help you realize your 
                    deepest dreams.<br>
                    Sign up now to get started</p>
                <p>You know you want to.</p>
            </div>
            <form id="sign-up-form" action="">
                <p>Let's do this!</p>
                <div>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" name="first-name" id="first-name">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                    <label for="password">PASSWORD</label>
                    <input type="password" name="password" id="password">
                </div>
                <div>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" name="last-name" id="last-name">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="text" name="phone" id="phone">
                    <label for="confirm-pass">CONFIRM PASSWORD</label>
                    <input type="password" name="confirm-pass" id="confirm-pass">
                </div>
            </form>
            <div>
                <button form="sign-up-form" type="submit">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </body>
</html>
